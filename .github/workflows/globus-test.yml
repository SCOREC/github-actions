name: Globus-Systems

on:
  workflow_call:
    inputs:
      machine:
        required: true
        type: string

concurrency:
  group: systems-${{ inputs.machine }}
  cancel-in-progress: true

jobs:
  run-globus:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

    - name: checkout repo
      uses: actions/checkout@v4

    - name: checkout globus file
      uses: actions/checkout@v4
      with:
        repository: SCOREC/github-actions
        path: .github/workflows/globus
        sparse-checkout: |
          run-globus.py
        sparse-checkout-cone-mode: false

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: install packing
      run: sudo apt install python3-packaging

    - name: install globus
      run: |
          python -m ensurepip --upgrade --user
          python -m pip install globus-compute-endpoint
          python -m pip install dill==0.3.5.1

    - name: use globus
      working-directory: .github/workflows
      env:
        GLOBUS_ID: ${{ secrets.GLOBUS_COMPUTE_ID }}
        GLOBUS_SECRET_PERLMUTTER: ${{ secrets.GLOBUS_COMPUTE_SECRET_PERLMUTTER }}
        GLOBUS_SECRET_FRONTIER: ${{ secrets.GLOBUS_COMPUTE_SECRET_FRONTIER }}
      run: |
        export GLOBUS_COMPUTE_CLIENT_ID="$GLOBUS_ID"
        if [ "${{ inputs.machine }}" == "perlmutter" ]; then
          export GLOBUS_COMPUTE_CLIENT_SECRET="$GLOBUS_SECRET_PERLMUTTER"
          export TARGET_ENDPOINT=2f93149a-349b-46fc-9544-4adf84d74447
        fi
        if [ "${{ inputs.machine }}" == "frontier" ]; then
          export GLOBUS_COMPUTE_CLIENT_SECRET="$GLOBUS_SECRET_FRONTIER"
          export TARGET_ENDPOINT=cfa0c132-09d4-4dc9-824b-a057eeb7a38c
        fi
        python globus/run-globus.py ${{ inputs.machine }} ${{ github.event.repository.name }} ${{ github.sha }} $TARGET_ENDPOINT

    - name: print build log
      working-directory: .github/workflows
      run: cat Build.log

    - name: print test log
      working-directory: .github/workflows
      run: cat Test.log

    - name: check failed test
      working-directory: .github/workflows
      run: if grep ".   Failed" Test.log; then return 1; fi
